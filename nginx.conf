server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml text/xml application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = / {
    try_files /index.html =404;
  }

  # Hashed assets — long cache, immutable.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # RSS feeds — short cache.
  location ~ ^/(id/)?rss\.xml$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    types { application/rss+xml xml; }
  }

  # Astro emits .html files for routes; trailingSlash: "never".
  location / {
    try_files $uri $uri.html $uri/index.html /index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
