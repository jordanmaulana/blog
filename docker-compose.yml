services:
  jordanmaulana-blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: jordanmaulana-blog:latest
    container_name: jordanmaulana-blog
    restart: unless-stopped
    ports:
      - "4321:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
