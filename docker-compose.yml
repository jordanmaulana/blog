services:
  jordanmaulana-blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_TIPJAR_URL: ${PUBLIC_TIPJAR_URL}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL}
        PUBLIC_BOOKING_URL: ${PUBLIC_BOOKING_URL}
        PUBLIC_UMAMI_SRC: ${PUBLIC_UMAMI_SRC}
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID}
        PUBLIC_NEWSLETTER_ACTION: ${PUBLIC_NEWSLETTER_ACTION}
    image: jordanmaulana-blog:latest
    container_name: jordanmaulana-blog
    restart: unless-stopped
    ports:
      - "4321:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
